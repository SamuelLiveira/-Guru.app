<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>üGuru — Oráculo de Versailles</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="state-calm">

    <header style="padding-top: 20px;">
        <h1 class="logo">üGuru</h1>
    </header>

    <main id="chat-container">
        <div class="message guru-msg">
            Bem-vindo ao vácuo entre as estrelas, Iniciado. 
            Este Oráculo aguarda o sopro da sua curiosidade. Como devo chamá-lo?
        </div>
    </main>

    <footer class="input-area">
        <input type="text" id="user-input" placeholder="Sussurre sua pergunta..." autocomplete="off">
        <button id="send-btn"></button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
